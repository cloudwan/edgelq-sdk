syntax = "proto3";

package ntt.cellular_api.v1;

import "edgelq-sdk/cellular-api/proto/v1/sim_card.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cloudwan/edgelq-sdk/cellular-api/client/v1/contract;contract_client";
option java_multiple_files = false;
option java_outer_classname = "ContractCustomProto";
option java_package = "com.ntt.cellular_api.pb.v1";

// A request message of the SubscribeCarrierEvents method. Streams read with the
// region's operator consumer group, and Event Hubs allows 5 readers of one
// group per partition, so a 6th concurrent stream in a region fails.
message SubscribeCarrierEventsRequest {
  // Name of ntt.cellular_api.v1.Contract
  string name = 1;

  // Events enqueued within this period before the call are replayed first.
  // Default 0: only events that arrive after the call. At most 24h.
  google.protobuf.Duration lookback = 2;

  // The stream ends after this period. Default 1m, at most 1h.
  google.protobuf.Duration timeout = 3;

  // Only events of the SIM card with this ICCID. Empty: every SIM card.
  string iccid = 4;

  // Only events of these types, as the carrier names them (for Transatel,
  // e.g. "NETWORK/LOCATION-UPDATE/ACCEPTED"). An entry ending in "*" matches by
  // prefix ("NETWORK/*"). Empty: every type. With a SIM card filter, both must
  // match.
  repeated string event_types = 5;

  // Only events of this SIM card, whose id is its ICCID. Same as iccid, so
  // setting both needs them to agree. The SimCard is not read: it may not
  // exist (anymore), and the events still tell about it.
  string sim_card = 6;
}

// A response message of the SubscribeCarrierEvents method, one per event.
message SubscribeCarrierEventsResponse {
  string partition_id = 1;

  int64 sequence_number = 2;

  // When the event was received.
  google.protobuf.Timestamp enqueued_time = 3;

  // Event body as the carrier sent it (JSON for Transatel).
  string body = 4;

  // Type of the event, as the carrier names it. Empty if it cannot be read.
  string event_type = 5;

  // ICCID of the SIM card the event is about. Empty if it cannot be read.
  string iccid = 6;
}

// A request message of the ListBundleProducts method.
message ListBundleProductsRequest {
  // Name of ntt.cellular_api.v1.Contract
  string name = 1;

  // Only products of this category. Unspecified: all.
  Category category = 2;

  // Category is what kind of product: one bought once, or one that renews.
  enum Category {
    // In a request: every category.
    CATEGORY_UNSPECIFIED = 0;

    // Valid once, for its own period, then gone.
    ONE_OFF = 1;

    // Renews every period until its renewal is stopped.
    RECURRING = 2;

    // Tops up a parent product and ends with it.
    ADD_ON = 3;
  }
}

// A response message of the ListBundleProducts method.
message ListBundleProductsResponse {
  repeated Product products = 1;

  // Product is one bundle the carrier sells under the contract.
  message Product {
    // The carrier's product ID: what a bundle request names.
    string product_id = 1;

    ListBundleProductsRequest.Category category = 2;

    // The carrier's short description; empty where it has none.
    string description = 3;

    // Data allowance per period, in kilobytes of 1024 bytes as the carrier
    // counts them. -1 when the allowance is unlimited, 0 when the product
    // has none.
    int64 data_kb = 4;

    // How long one period lasts: validity_duration of validity_unit
    // ("days", "months").
    int32 validity_duration = 5;

    string validity_unit = 6;

    // Where the allowance may be used, as the carrier lists it (ISO 3166
    // alpha-3).
    repeated string countries = 7;

    // Products that cannot be held together. Ordering a recurring product of
    // a group the SIM already holds one of switches to it at the old one's
    // renewal; any other order adds.
    repeated string exclusion_groups = 8;
  }
}
