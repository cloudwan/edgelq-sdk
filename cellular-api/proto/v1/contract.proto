syntax = "proto3";

package ntt.cellular_api.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "goten-sdk/types/meta.proto";

option go_package = "github.com/cloudwan/edgelq-sdk/cellular-api/resources/v1/contract;contract";
option java_multiple_files = true;
option java_outer_classname = "ContractProto";
option java_package = "com.ntt.cellular_api.pb.v1";

// Contract Resource
message Contract {
  option (google.api.resource) = {
    type : "cellular-api.edgelq.com/Contract"
    pattern : "contracts/{contract}"
  };

  // Name of Contract
  // When creating a new instance, this field is optional and if not provided,
  // it will be generated automatically. Last ID segment must conform to the
  // following regex: [a-z][a-z0-9\\-]{0,28}[a-z0-9]
  string name = 1;

  // Metadata is an object with information like create, update and delete time
  // (for async deleted resources), has user labels/annotations, sharding
  // information, multi-region syncing information and may have non-schema
  // owners (useful for taking ownership of resources belonging to lower level
  // services by higher ones).
  goten.types.Meta metadata = 2;

  string rate_plan = 3;

  // AccountReference is the carrier's own identifier for the account this
  // agreement draws on. Transatel calls it the mvnoRef.
  //
  // Sent in OCS orders, for example M2MA_WW_TSL_GSUK. Optional. Required to
  // order bundles. Transatel Contracts only: letters, digits, _ and -, at
  // most 64.
  string account_reference = 9;

  // BundleCatalog is the carrier's catalogue the product is looked up in, and
  // asked what ordering it would do. Transatel calls it the class of service:
  // WW_M2MA_COS_IOT_CONNECT on Capped Plans. Required when a bundle is named.
  //
  // Optional. Transatel Contracts only: letters, digits, _ and -, at most 64.
  string bundle_catalog = 13;

  // CarrierAccount contains api credential for backend to call each carrier
  // APIs, therefore it is packed as a Secret resource (for Transatel, the
  // Secret in transatel.credential). Secret resource itself must contain
  // following data field in each carrier:
  //
  // - Transatel
  // {
  //  "data": {
  //    "client_id": "<CLIENTID>",
  //    "client_secret": "<CLIENTSECRET>"
  //   }
  // }
  //
  // - Cisco
  // ..
  // - Celona
  // ..
  oneof carrier_account {
    // Transatel is the account of a Transatel Contract.
    TransatelAccount transatel = 15;

    // The Secret reference of a Transatel Contract that earlier builds stored
    // as a plain string in field 5. It is read only, and only until the
    // Contract is updated with transatel.credential: usage collection, the
    // carrier events and SIM card calls keep working with it, and the bundle
    // features stay off because no scopes are recorded for it. A request
    // cannot set it on a Contract that does not hold it. Do not reuse 5 for
    // anything else.
    string transatel_legacy = 5 [ deprecated = true ];

    string cisco = 6;

    string celona = 7;
  }

  // Field 14: 8 to 13 belong to the eSIM and bundle fields of
  // cloudwan/edgelq#1314, so the two can merge in either order. 9
  // (account_reference) and 13 (bundle_catalog) are declared here with its
  // names and meaning; 8 and 10 to 12 are still free for it.
  Status status = 14 [ (google.api.field_behavior) = OUTPUT_ONLY ];

  // TransatelAccount is the carrier account of a Transatel Contract.
  message TransatelAccount {
    // Credential is the Secret that holds the client_id and client_secret of
    // the Transatel API.
    string credential = 1;

    // Scopes are the scopes Transatel granted to the credential, which the
    // bundle features need. The API server reads them when the Contract is
    // created or credential changes, and does not refresh them later. A value
    // in a request is ignored, and changing the data of the same Secret does
    // not read them again: to read them again, create the Secret under
    // another name and set credential to it.
    //
    // Empty means not read, or none granted. The bundle features stay off
    // until credential is set again, which reads them even when it names the
    // same Secret.
    repeated string scopes = 2 [ (google.api.field_behavior) = OUTPUT_ONLY ];
  }

  // Status is written by the cellular-api controller of the owning region, not
  // by users.
  message Status {
    // Unset for carriers without a data stream.
    EventHub event_hub = 1;

    // EventHub is the Azure event hub that receives the carrier's data stream
    // of this Contract.
    message EventHub {
      // Event Hubs namespace, name only (without .servicebus.windows.net).
      // Set together with name, once the event hub exists.
      string namespace = 1;

      // Name of the event hub in the namespace. Empty until it exists.
      string name = 2;

      // Why the last attempt failed. Empty after a successful one.
      string error = 3;

      // Secret that holds the connection string of the send policy, under the
      // key "connection_string". It is created next to the carrier account
      // Secret. The carrier side is registered with it by hand. DeleteContract
      // deletes it, so the reference may dangle: unsetting it would write the
      // Contract again and make the controller create the Secret it is
      // deleting.
      string connection_secret = 4;
    }
  }
}
