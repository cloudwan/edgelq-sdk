syntax = "proto3";

package ntt.cellular_api.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "goten-sdk/types/meta.proto";

option go_package = "github.com/cloudwan/edgelq-sdk/cellular-api/resources/v1/contract;contract";
option java_multiple_files = true;
option java_outer_classname = "ContractProto";
option java_package = "com.ntt.cellular_api.pb.v1";

// Contract Resource
message Contract {
  option (google.api.resource) = {
    type : "cellular-api.edgelq.com/Contract"
    pattern : "contracts/{contract}"
  };

  // Name of Contract
  // When creating a new instance, this field is optional and if not provided,
  // it will be generated automatically. Last ID segment must conform to the
  // following regex: [a-z][a-z0-9\\-]{0,28}[a-z0-9]
  string name = 1;

  // Metadata is an object with information like create, update and delete time
  // (for async deleted resources), has user labels/annotations, sharding
  // information, multi-region syncing information and may have non-schema
  // owners (useful for taking ownership of resources belonging to lower level
  // services by higher ones).
  goten.types.Meta metadata = 2;

  string rate_plan = 3;

  // CarrierAccount contains api credential for backend to call each carrier
  // APIs, therefore it is packed as a Secret resource. Secret resource itself
  // must contain following data field in each carrier:
  //
  // - Transatel
  // {
  //  "data": {
  //    "client_id": "<CLIENTID>",
  //    "client_secret": "<CLIENTSECRET>"
  //   }
  // }
  //
  // - Cisco
  // ..
  // - Celona
  // ..
  oneof carrier_account {
    string transatel = 5;

    string cisco = 6;

    string celona = 7;
  }

  // Field 14: 8 to 13 belong to the eSIM and bundle fields of
  // cloudwan/edgelq#1314, so the two can merge in either order.
  Status status = 14 [ (google.api.field_behavior) = OUTPUT_ONLY ];

  // Status is written by the cellular-api controller of the owning region, not
  // by users.
  message Status {
    // Unset for carriers without a data stream.
    EventHub event_hub = 1;

    // EventHub is the Azure event hub that receives the carrier's data stream
    // of this Contract.
    message EventHub {
      // Event Hubs namespace, name only (without .servicebus.windows.net).
      // Set together with name, once the event hub exists.
      string namespace = 1;

      // Name of the event hub in the namespace. Empty until it exists.
      string name = 2;

      // Why the last attempt failed. Empty after a successful one.
      string error = 3;

      // Secret that holds the connection string of the send policy, under the
      // key "connection_string". It is created next to the carrier account
      // Secret. The carrier side is registered with it by hand. DeleteContract
      // deletes it, so the reference may dangle: unsetting it would write the
      // Contract again and make the controller create the Secret it is
      // deleting.
      string connection_secret = 4;
    }
  }
}
