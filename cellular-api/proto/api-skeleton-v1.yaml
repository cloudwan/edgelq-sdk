name: cellular-api.edgelq.com
proto:
  package:
    name: ntt.cellular_api
    currentVersion: v1
    goPackage: github.com/cloudwan/edgelq/cellular-api
    protoImportPathPrefix: edgelq/cellular-api/proto
  service:
    name: CellularApi
    defaultHost: cellular-api.edgelq.com
    oauthScopes: https://apis.edgelq.com

imports:
- meta.goten.com
- iam.edgelq.com
- secrets.edgelq.com

resources:
- name: Contract
  multiRegion:
    syncType: ALWAYS_GLOBALLY
  actions:
  # Streams the events the carrier sends for the Contract, so an operator can check a
  # data stream by triggering a test event.
  - name: SubscribeCarrierEvents
    verb: subscribeCarrierEvents
    streamingResponse: true
    withStoreHandle:
      readOnly: true
      transaction: NONE
  # The bundles the carrier sells under this agreement: what a bundle request
  # may name. On Contract because the catalog is the agreement's.
  - name: ListBundleProducts
    verb: listBundleProducts
    withStoreHandle:
      readOnly: true
      transaction: NONE
- name: SimCardStock
  idPattern: "\\\\d{19}"
  multiRegion:
    syncType: ALWAYS_GLOBALLY
  actions:
  - name: Allocate
    verb: allocate
    responseName: google.protobuf.Empty
    skipResponseMsgGen: true
    withStoreHandle:
      transaction: MANUAL
  - name: Deallocate
    verb: deallocate
    responseName: google.protobuf.Empty
    skipResponseMsgGen: true
    withStoreHandle:
      transaction: MANUAL
- name: SimCard
  parents:
  - iam.edgelq.com/Project
  scopeAttributes:
  - Region
  idPattern: "\\\\d{19}"
  actions:
  # The four transitions manage their own transactions: the carrier is polled
  # outside any, and an activation orders its bundle request through Subscribe,
  # which has transactions of its own.
  - name: Activate
    verb: activate
    responseName: google.protobuf.Empty
    skipResponseMsgGen: true
    withStoreHandle:
      transaction: MANUAL
  - name: Suspend
    verb: suspend
    responseName: google.protobuf.Empty
    skipResponseMsgGen: true
    withStoreHandle:
      transaction: MANUAL
  - name: Terminate
    verb: terminate
    responseName: google.protobuf.Empty
    skipResponseMsgGen: true
    withStoreHandle:
      transaction: MANUAL
  - name: Reactivate
    verb: reactivate
    responseName: google.protobuf.Empty
    skipResponseMsgGen: true
    withStoreHandle:
      transaction: MANUAL
  - name: GetDataUsage
    verb: getDataUsage
    grpcTranscoding:
      httpMethod: get
    withStoreHandle:
      readOnly: true
      transaction: NONE
  # Subscribes the SIM to a carrier product (a bundle) and returns the
  # Bundle it created. The carrier is called between two transactions.
  - name: Subscribe
    verb: subscribe
    responseName: Bundle
    skipResponseMsgGen: true
    withStoreHandle:
      transaction: MANUAL
  # Asks the carrier what the SIM holds now, with what is left of each bundle.
  # A read: nothing is written.
  - name: GetBundles
    verb: getBundles
    grpcTranscoding:
      httpMethod: get
    withStoreHandle:
      readOnly: true
      transaction: NONE
# One carrier product bundle of a SIM. Users write it only
# through SimCard Subscribe and the actions below.
- name: Bundle
  parents:
  - SimCard
  idPattern: "[a-z0-9][a-z0-9\\\\-]{0,62}[a-z0-9]"
  actions:
  # Named apart from SimCard Terminate: the generated CellularApiServer
  # embeds both services, so method names must differ.
  - name: TerminateBundle
    verb: terminate
    responseName: Bundle
    skipResponseMsgGen: true
    withStoreHandle:
      transaction: MANUAL
  - name: CancelRenewal
    verb: cancelRenewal
    responseName: Bundle
    skipResponseMsgGen: true
    withStoreHandle:
      transaction: MANUAL
